<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(headerTitle, headerSubtitle, content, pageScripts)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${headerTitle != null ? headerTitle + ' — AquaGuard AI' : 'AquaGuard AI — Smart Water Monitoring'}">AquaGuard AI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom AquaGuard Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div class="app-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{layout/sidebar :: sidebar}"></div>

    <!-- Main Container -->
    <div class="app-main">
        <!-- Topbar -->
        <div th:replace="~{layout/topbar :: topbar(${headerTitle}, ${headerSubtitle})}"></div>

        <!-- Dynamic Page Body Content -->
        <main class="container-fluid p-4">
            <!-- Global Flash Messages -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-4" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="disclaimer-banner">
                <div class="d-flex align-items-center gap-2">
                    <span class="fs-5">⚠️</span>
                    <div>
                        <strong id="global-data-mode-title" class="text-warning"
                                th:text="${systemStatus.hardwareConnected ? 'LIVE SENSOR TELEMETRY:' : 'NO LIVE SENSOR DATA:'}">NO LIVE SENSOR DATA:</strong>
                        <span id="global-data-mode-description" class="text-light ms-1" th:text="${systemStatus.diagnosticMessage}">Illustrative sample data.</span>
                    </div>
                </div>
                <span class="badge bg-dark border border-secondary text-light font-mono px-2 py-1">BUILD v1.0-PROTOTYPE</span>
            </div>

            <!-- Injected Page Content -->
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Chart.js 4.4.x -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<!-- AquaGuard App JS -->
<script th:src="@{/js/app.js}"></script>

<!-- Optional page-specific inline scripts block -->
<th:block th:replace="${pageScripts} ?: ~{}"></th:block>
</body>
</html>
